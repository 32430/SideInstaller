name: Debug Repository Structure

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  debug_files:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: List all files
      run: |
        echo "=== Current Directory ==="
        pwd
        echo "=== List of Files ==="
        find . -maxdepth 3 -not -path '*/.*'
