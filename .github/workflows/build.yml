name: Build SideInstaller (Rust & XcodeGen)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode version
      run: |
        sudo xcode-select -s /Applications/Xcode_15.4.app
        # システム環境変数としてXcodeのパスを固定する
        echo "DEVELOPER_DIR=/Applications/Xcode_15.4.app/Contents/Developer" >> $GITHUB_ENV

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-apple-ios

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Build Rust Core
      run: |
        # 付属のビルドスクリプトを実行してRustコードをiOS用にコンパイル
        chmod +x build-rust.sh
        ./build-rust.sh

    - name: Generate Xcode Project via XcodeGen
      run: |
        # project.ymlからSideInstaller.xcodeprojを自動生成
        xcodegen generate

    - name: Build Archive
      run: |
        mkdir -p $GITHUB_WORKSPACE/build
        xcodebuild archive \
          -project "SideInstaller.xcodeproj" \
          -scheme "SideInstaller" \
          -configuration Release \
          -archivePath $GITHUB_WORKSPACE/build/SideInstaller.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY=""

    - name: Create Unsigned IPA
      run: |
        mkdir -p $GITHUB_WORKSPACE/build/Payload
        mv $GITHUB_WORKSPACE/build/SideInstaller.xcarchive/Products/Applications/*.app $GITHUB_WORKSPACE/build/Payload/
        cd $GITHUB_WORKSPACE/build
        zip -r SideInstaller_unsigned.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SideInstaller_unsigned
        path: ${{ github.workspace }}/build/SideInstaller_unsigned.ipa
