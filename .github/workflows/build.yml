name: Build SideInstaller (SideStore Ready)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode version
      run: sudo xcode-select -s /Applications/Xcode_15.4.app

    - name: Build Archive
      run: |
        xcodebuild archive \
          -project "SideInstaller.xcodeproj" \
          -scheme "SideInstaller" \
          -configuration Release \
          -archivePath $GITHUB_WORKSPACE/build/SideInstaller.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY=""

    - name: Create Unsigned IPA
      run: |
        mkdir -p $GITHUB_WORKSPACE/build/Payload
        mv $GITHUB_WORKSPACE/build/SideInstaller.xcarchive/Products/Applications/*.app $GITHUB_WORKSPACE/build/Payload/
        cd $GITHUB_WORKSPACE/build
        zip -r SideInstaller_unsigned.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SideInstaller_unsigned
        path: ${{ github.workspace }}/build/SideInstaller_unsigned.ipa
