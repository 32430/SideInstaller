name: Build SideInstaller IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build SideInstaller IPA
    runs-on: macos-26

    steps:
      # ========================================
      # Checkout
      # ========================================
      - name: Checkout
        uses: actions/checkout@v5

      # ========================================
      # Select Xcode
      # ========================================
      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for installed Xcode..."

          XCODE_APP="$(
            find /Applications \
              -maxdepth 1 \
              -name 'Xcode*.app' \
              -print 2>/dev/null \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$XCODE_APP" ]; then
            echo "ERROR: Xcode was not found."
            echo
            echo "Available Xcode installations:"
            ls -la /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi

          XCODE_DIR="$XCODE_APP/Contents/Developer"

          if [ ! -d "$XCODE_DIR" ]; then
            echo "ERROR: Invalid Xcode developer directory:"
            echo "$XCODE_DIR"
            exit 1
          fi

          echo "Selected Xcode:"
          echo "$XCODE_APP"

          echo "Developer directory:"
          echo "$XCODE_DIR"

          echo "DEVELOPER_DIR=$XCODE_DIR" >> "$GITHUB_ENV"

          export DEVELOPER_DIR="$XCODE_DIR"

          echo
          echo "=== Xcode ==="
          xcodebuild -version

          echo
          echo "=== Developer directory ==="
          xcode-select -p

          echo
          echo "=== macOS SDK ==="
          xcrun --sdk macosx --show-sdk-path

          echo
          echo "=== iOS SDK ==="
          xcrun --sdk iphoneos --show-sdk-path

      # ========================================
      # Show environment
      # ========================================
      - name: Show environment
        run: |
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"
          echo
          echo "Swift:"
          swift --version
          echo
          echo "Xcode:"
          xcodebuild -version

      # ========================================
      # Install XcodeGen
      # ========================================
      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Check XcodeGen
        run: |
          xcodegen version

      # ========================================
      # Install Rust
      # ========================================
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-apple-ios
            aarch64-apple-ios-sim

      # ========================================
      # Check Rust
      # ========================================
      - name: Check Rust
        run: |
          rustc --version
          cargo --version
          rustup show

      # ========================================
      # Build Rust core
      # ========================================
      - name: Build Rust core
        shell: bash
        run: |
          set -euo pipefail

          echo "Building Rust core..."

          if [ ! -f "./build-rust.sh" ]; then
            echo "ERROR: build-rust.sh was not found."
            exit 1
          fi

          chmod +x ./build-rust.sh
          ./build-rust.sh

      # ========================================
      # Check Rust output
      # ========================================
      - name: Check Rust output
        shell: bash
        run: |
          echo "Searching for generated XCFrameworks..."

          find . \
            -type d \
            -name "*.xcframework" \
            -print

      # ========================================
      # Generate Xcode project
      # ========================================
      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "project.yml" ]; then
            echo "ERROR: project.yml was not found."
            exit 1
          fi

          xcodegen generate

      # ========================================
      # Check generated project
      # ========================================
      - name: Check Xcode project
        run: |
          ls -la

          echo
          echo "Xcode projects:"
          find . \
            -maxdepth 3 \
            -name "*.xcodeproj" \
            -print

      # ========================================
      # Build iOS application
      # ========================================
      - name: Build iOS app
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project SideInstaller.xcodeproj \
            -scheme SideInstaller \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # ========================================
      # Locate app
      # ========================================
      - name: Locate built app
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for SideInstaller.app..."

          find build \
            -type d \
            -name "SideInstaller.app" \
            -print

      # ========================================
      # Inspect application
      # ========================================
      - name: Inspect application
        shell: bash
        run: |
          set -uo pipefail

          APP="build/DerivedData/Build/Products/Release-iphoneos/SideInstaller.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: Application not found:"
            echo "$APP"
            exit 1
          fi

          echo "========================================"
          echo "APP INFORMATION"
          echo "========================================"

          echo
          echo "Path:"
          echo "$APP"

          echo
          echo "Files:"
          find "$APP" -maxdepth 2 -print

          echo
          echo "========================================"
          echo "CODE SIGNATURE"
          echo "========================================"

          codesign -dvvv "$APP" 2>&1 || true

          echo
          echo "========================================"
          echo "ENTITLEMENTS"
          echo "========================================"

          codesign -d --entitlements :- "$APP" 2>&1 || true

          echo
          echo "========================================"
          echo "PROVISIONING PROFILE"
          echo "========================================"

          if [ -f "$APP/embedded.mobileprovision" ]; then
            echo "embedded.mobileprovision exists."

            security cms \
              -D \
              -i "$APP/embedded.mobileprovision" \
              2>&1 || true
          else
            echo "No embedded.mobileprovision found."
          fi

          echo
          echo "========================================"
          echo "INFO.PLIST"
          echo "========================================"

          /usr/libexec/PlistBuddy \
            -c "Print" \
            "$APP/Info.plist" \
            2>&1 || true

      # ========================================
      # Check app
      # ========================================
      - name: Check built app
        shell: bash
        run: |
          set -euo pipefail

          APP="build/DerivedData/Build/Products/Release-iphoneos/SideInstaller.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: SideInstaller.app was not found."
            exit 1
          fi

          echo "SideInstaller.app found:"
          ls -lah "$APP"

      # ========================================
      # Create IPA
      # ========================================
      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail

          APP="build/DerivedData/Build/Products/Release-iphoneos/SideInstaller.app"

          mkdir -p build/Payload

          cp -R "$APP" build/Payload/

          cd build

          rm -f SideInstaller-unsigned.ipa

          zip -r \
            SideInstaller-unsigned.ipa \
            Payload

      # ========================================
      # Check IPA
      # ========================================
      - name: Check IPA
        shell: bash
        run: |
          set -euo pipefail

          IPA="build/SideInstaller-unsigned.ipa"

          if [ ! -f "$IPA" ]; then
            echo "ERROR: IPA was not created."
            exit 1
          fi

          echo "========================================"
          echo "IPA CREATED"
          echo "========================================"

          ls -lh "$IPA"

          echo
          echo "========================================"
          echo "IPA CONTENTS"
          echo "========================================"

          unzip -l "$IPA"

      # ========================================
      # Upload IPA
      # ========================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SideInstaller-unsigned-ipa
          path: build/SideInstaller-unsigned.ipa
          if-no-files-found: error

      # ========================================
      # Upload APP
      # ========================================
      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: SideInstaller-app
          path: build/DerivedData/Build/Products/Release-iphoneos/SideInstaller.app
          if-no-files-found: error
